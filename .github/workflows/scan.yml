name: Scansione giornaliera

on:
  schedule:
    - cron: '15 23 * * 1-5'  # 23:15 Madrid, anche dopo il cambio ora
      timezone: Europe/Madrid
    - cron: '45 7 * * 2-6'   # 07:45 Madrid, giro di sicurezza
      timezone: Europe/Madrid
  workflow_dispatch: {}      # il TUO pulsante "Run workflow"

permissions:
  contents: write

concurrency:
  group: stock-monitor-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dipendenze
        run: pip install requests

      - name: Scansione
        env:
          EOD_API_KEY: ${{ secrets.EOD_API_KEY }}
        run: python scan.py

      - name: Pubblica risultati
        run: |
          git config user.name  "stock-monitor-bot"
          git config user.email "actions@github.com"
          git add docs/
          git diff --cached --quiet && echo "Nessun cambiamento" && exit 0
          git commit -m "Scansione $(date -u +%F)"
          git pull --rebase origin main
          git push
