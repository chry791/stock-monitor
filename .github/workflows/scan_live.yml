name: Anteprima serale

on:
  schedule:
    - cron: '55 16 * * 1-5'  # Europa: 16:55 Madrid, estate e inverno
      timezone: Europe/Madrid
    - cron: '15 15 * * 1-5'  # USA: 15:15 New York, normalmente 21:15 Madrid
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      market:
        description: 'Mercato (auto sceglie in base all’orario di Madrid)'
        type: choice
        required: false
        default: auto
        options:
          - auto
          - eu
          - us

permissions:
  contents: write

concurrency:
  group: stock-monitor-data
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dipendenze
        run: pip install requests

      - name: Anteprima serale
        env:
          EOD_API_KEY: ${{ secrets.EOD_API_KEY }}
          MARKETS: ${{ github.event_name == 'schedule' && (github.event.schedule == '55 16 * * 1-5' && 'eu' || 'us') || inputs.market || 'auto' }}
        run: python scan_live.py

      - name: Pubblica anteprima
        run: |
          git config user.name  "stock-monitor-bot"
          git config user.email "actions@github.com"
          git add docs/live.json
          git diff --cached --quiet && echo "Nessun cambiamento" && exit 0
          git commit -m "Anteprima serale $(date -u '+%F %H:%M')"
          git pull --rebase origin main
          git push
